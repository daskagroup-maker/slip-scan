<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>傳票掃描入庫</title>
<meta name="theme-color" content="#2E4A8B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="傳票掃描">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{
  --paper:#F1F3F5; --card:#FFFFFF; --ink:#1D2A44; --ink2:#5B6679; --line:#D6DBE2;
  --carbon:#2E4A8B; --carbon-soft:#E3E9F5; --stamp:#C8372D; --ok:#2F7D4F; --onc:#fff;
  --s0:#2E4A8B; --s1:#2F7D4F; --s2:#B7791F; --s3:#C8372D; --s4:#6B46A8; --s5:#0E7C86; --s6:#8A5A3C; --sx:#8A93A3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161E; --card:#1B212C; --ink:#E6EAF1; --ink2:#9AA4B5; --line:#2C3442;
    --carbon:#8FA9E6; --carbon-soft:#232E45; --stamp:#E8685E; --ok:#5DBB84; --onc:#10141B;
    --s0:#8FA9E6; --s1:#5DBB84; --s2:#E0A94A; --s3:#E8685E; --s4:#B195E6; --s5:#4FC2CC; --s6:#C8977A; --sx:#77808F;
  }
}
:root[data-theme="dark"]{
  --paper:#12161E; --card:#1B212C; --ink:#E6EAF1; --ink2:#9AA4B5; --line:#2C3442;
  --carbon:#8FA9E6; --carbon-soft:#232E45; --stamp:#E8685E; --ok:#5DBB84; --onc:#10141B;
  --s0:#8FA9E6; --s1:#5DBB84; --s2:#E0A94A; --s3:#E8685E; --s4:#B195E6; --s5:#4FC2CC; --s6:#C8977A; --sx:#77808F;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:12px 14px 110px}
.meta{font-size:13px;color:var(--ink2)}

.datebar{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.stamp{flex:none;width:74px;height:74px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);
  font-weight:900;line-height:1.05;position:relative}
.stamp::after{content:"";position:absolute;inset:4px;border:1px solid var(--stamp);border-radius:50%;opacity:.55}
.stamp .m{font-size:12px}.stamp .d{font-size:26px;font-variant-numeric:tabular-nums}.stamp .w{font-size:11px}
.datectl{flex:1;min-width:0}
.datectl .lbl{font-size:13px;color:var(--ink2);margin-bottom:3px}
.row{display:flex;gap:6px;align-items:center}
input[type=date],input[type=month]{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.nav{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:18px}
.linkbtn{border:0;background:none;color:var(--carbon);padding:2px 0;font-size:14px}

/* mode switch */
.mode{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.mode button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--ink2)}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* sizes */
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sz{min-width:56px;padding:9px 12px;border-radius:10px;border:2px solid var(--c,var(--sx));background:var(--card);color:var(--c,var(--sx));font-weight:900;font-variant-numeric:tabular-nums}
.sz[aria-pressed=true]{background:var(--c);color:var(--onc)}
.sz.edit{border-style:dashed;border-color:var(--line);color:var(--ink2);font-weight:500;min-width:auto}
.badge{display:inline-block;min-width:38px;text-align:center;padding:1px 8px;border-radius:6px;background:var(--c,var(--sx));color:var(--onc);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin:0 0 10px}
.check input{width:18px;height:18px}

.scanbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:17px;border:0;border-radius:14px;background:var(--carbon);color:var(--onc);font-size:19px;font-weight:700}
.scanbtn.look{background:var(--ink);color:var(--paper)}
.scanbtn svg{width:26px;height:26px}
.alt{display:flex;gap:8px;margin-top:8px}
.alt button{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px}
.manual{display:flex;gap:8px;margin-top:8px}
.manual input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-variant-numeric:tabular-nums}
.manual button{padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700}
/* UI scale (camera video itself is not scaled) */
:root{--z:1.3}
.wrap,.sheetin,.camtop,.toastin,.guide-in,.camlook #lookup,.cbar-in{zoom:var(--z)}
.camlook{}
.camlook #lookup{margin:0 auto;max-width:440px}
@media (max-width:480px){.stamp{width:60px;height:60px}.stamp .d{font-size:22px}.nav{width:34px}.datebar input[type=date]{padding:8px 4px;font-size:15px}}
.zoomctl{display:flex;align-items:center;gap:4px}
.zoomctl button{min-width:40px;padding:6px 8px!important}
.zoomctl button[aria-pressed=true]{background:var(--ink)!important;color:var(--paper);border-color:var(--ink)!important}
.smode{margin:4px 0 10px}
.smode button{font-size:15px}
.bhint{font-size:14px;color:var(--ink2);background:var(--carbon-soft);border-radius:10px;padding:8px 10px;margin:-2px 0 10px}
body.batch .stamp{border-width:4px}
.bdates{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;zoom:var(--z)}
.bdates button{flex:none;border:2px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.bdates button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff;font-weight:900}
.blabel{font-size:12px;opacity:.6;zoom:var(--z)}
.sheet.batchmode #shMore>*:not(#shOrdWrap){display:none}
/* sticker color */
.ctarget{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 200vmax rgba(0,0,0,.5),inset 0 0 0 3px rgba(0,0,0,.4);z-index:2;pointer-events:none}
.ctarget::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(255,255,255,.7);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.ctarget::before{animation:none}}
.ctarget::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff}
.cbar{display:flex;justify-content:center}
.cbar-in{pointer-events:auto;background:rgba(20,25,35,.9);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:92vw}
.cbar-in .sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;flex:none}
.cbar-in .lb{font-weight:700;min-width:5.5em;white-space:nowrap}
.cbar-in button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;white-space:nowrap}
.cbar-in .go{background:var(--ok);color:#fff}
.cbar-in .sk{background:rgba(255,255,255,.18);color:#fff}
.cchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.cchip{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;min-width:44px;font-size:15px}
.cchip i{display:block;width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.cchip i.none{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px)}
.cchip[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.cpanel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.crow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.crow i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.crow i.none{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px)}
.crow b{flex:none;width:3em}
.crow .cname{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.crow .cpick{width:40px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;flex:none}
.cchip small{font-size:11px;color:var(--ink2);line-height:1}
.crow button,.cpanel .bigbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.cpanel .bigbtn{width:100%;margin-top:8px;padding:11px;background:var(--carbon);color:var(--onc);border:0;font-weight:700}
.cpanel input[type=number]{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:16px}
.sheet .auto{color:var(--ok);font-weight:700}
.shsum{font-size:17px;font-weight:700;margin-top:2px}
.shsum .src{font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px}
.shsum .run{color:var(--carbon)}
.ocrchk{margin-top:6px;padding:8px 10px;border-radius:10px;background:#FFF4D6;color:#5A4300;font-size:15px;font-weight:700}
.ocrchk button{border:2px solid #B7791F;background:#fff;color:#5A4300;border-radius:8px;padding:6px 10px;font-weight:900;font-size:16px;margin:2px}
/* full-screen camera */
.cam{position:fixed;inset:0;background:#000;z-index:15;display:none;flex-direction:column}
.cam.on{display:flex}
.camtop{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;color:#fff;background:rgba(0,0,0,.55)}
.camtop button{flex:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:7px 12px;font-weight:700}
.camtop .info{flex:1;min-width:0;font-size:14px;line-height:1.35}
.camtop .info b{font-size:16px}
.camtop .n{flex:none;text-align:center;line-height:1.1}
.camtop .n b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.camtop .n span{font-size:11px;opacity:.8}
.cambody{flex:0 0 36vh;position:relative;display:flex;align-items:center;overflow:hidden;background:#000}
.campanel{flex:1;min-height:0;overflow-y:auto;background:#151a22;color:#fff;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.recent{list-style:none;margin:0;padding:0;zoom:var(--z)}
.recent li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);margin-bottom:6px;font-variant-numeric:tabular-nums}
.recent li .c{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent li .d{font-size:13px;opacity:.75}
.recent .hd{font-size:13px;opacity:.6;margin:0 0 6px}
.sheet.incam{top:var(--sheetTop,50vh);max-height:none;border-radius:16px 16px 0 0}
#reader{width:100%}
#reader video{width:100%;height:auto;display:block}
.torch{flex:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:7px 10px;font-size:18px}
.torch[aria-pressed=true]{background:#ffd60a;color:#111;border-color:#ffd60a}
.cam::after{content:"";position:absolute;inset:0;pointer-events:none;border:0 solid var(--ok);transition:border-width .15s}
.cam.hit::after{border-width:10px}
.cam.bad::after{border-color:var(--stamp);border-width:10px}
.toast{position:absolute;left:50%;top:8%;transform:translate(-50%,-10px);opacity:0;transition:opacity .15s,transform .15s;
  background:rgba(20,25,35,.88);color:#fff;border-radius:14px;padding:12px 18px;text-align:center;z-index:2;max-width:90%;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .t1{font-size:22px;font-weight:900;white-space:nowrap}
.toast .t2{font-size:15px;white-space:nowrap;opacity:.85;word-break:break-all}
.toast .badge{font-size:18px;padding:2px 10px}
#qr-shaded-region{display:none!important}
#reader img,#reader__dashboard_section_csr{display:none!important}
/* viewfinder */
.vf{position:absolute;z-index:2;pointer-events:none;border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);transition:box-shadow .2s}
.vf::before{content:"";position:absolute;inset:-3px;border-radius:16px;
  background:
   linear-gradient(#fff,#fff) top left/34px 5px, linear-gradient(#fff,#fff) top left/5px 34px,
   linear-gradient(#fff,#fff) top right/34px 5px, linear-gradient(#fff,#fff) top right/5px 34px,
   linear-gradient(#fff,#fff) bottom left/34px 5px, linear-gradient(#fff,#fff) bottom left/5px 34px,
   linear-gradient(#fff,#fff) bottom right/34px 5px, linear-gradient(#fff,#fff) bottom right/5px 34px;
  background-repeat:no-repeat}
.vf::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:3px;border-radius:2px;background:#ff3b30;box-shadow:0 0 12px 2px rgba(255,59,48,.8);animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{top:12%}to{top:88%}}
.vf.got::before{background:
   linear-gradient(var(--ok),var(--ok)) top left/34px 5px, linear-gradient(var(--ok),var(--ok)) top left/5px 34px,
   linear-gradient(var(--ok),var(--ok)) top right/34px 5px, linear-gradient(var(--ok),var(--ok)) top right/5px 34px,
   linear-gradient(var(--ok),var(--ok)) bottom left/34px 5px, linear-gradient(var(--ok),var(--ok)) bottom left/5px 34px,
   linear-gradient(var(--ok),var(--ok)) bottom right/34px 5px, linear-gradient(var(--ok),var(--ok)) bottom right/5px 34px;background-repeat:no-repeat}
.vf.got::after{display:none}
@media (prefers-reduced-motion:reduce){.vf::after{animation:none}}
/* big instruction */
.guide{display:flex;justify-content:center}
.guide-in{text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);padding:0 14px}
.guide-in .g1{font-size:24px;font-weight:900;line-height:1.25}
.guide-in .g2{font-size:15px;opacity:.9;margin-top:2px}
.guide-in .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#111;font-size:18px;margin-right:8px;vertical-align:3px;text-shadow:none}
/* steps */
.camtop{flex-wrap:wrap;row-gap:6px}
.steps{order:3;flex:1 0 100%;display:flex;justify-content:center;gap:6px;min-width:0}
.camtop .ttl2{flex:1;text-align:center;font-weight:700;font-size:16px}
.steps span{display:flex;align-items:center;gap:4px;font-size:13px;color:rgba(255,255,255,.55);padding:4px 8px;border-radius:999px;white-space:nowrap}
.steps span b{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;border:1.5px solid currentColor;font-size:12px}
.steps span.on{background:#fff;color:#111;font-weight:700}
.steps span.done{color:var(--ok)}
.steps span.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.camtop .ttl{flex:1;text-align:center;font-weight:700}
body.camOn{overflow:hidden}
.msg{min-height:22px;margin:10px 2px 0;font-size:14px;color:var(--ink2)}
.msg.warn{color:var(--stamp)} .msg.ok{color:var(--ok)}

/* lookup result: big */
.lookup{display:none;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.lookup.on{display:block}
.lookup .code{font-size:14px;color:var(--ink2);word-break:break-all}
.lookup .big{display:flex;justify-content:center;align-items:center;gap:14px;margin:8px 0 4px}
.lookup .bd{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.lookup .bs{font-size:34px;font-weight:900;padding:4px 14px;border-radius:12px;background:var(--c,var(--sx));color:var(--onc);font-variant-numeric:tabular-nums}
.lookup.miss .bd{color:var(--stamp);font-size:24px}

.tabs{display:flex;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0;border:0;background:none;color:var(--ink2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--carbon);font-weight:700}

.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.summary span{font-size:14px}
.list{list-style:none;margin:0;padding:0}
.slip{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--sx));
  border-radius:6px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.slip.flash{animation:fl .6s}
@keyframes fl{from{background:var(--carbon-soft)}to{background:var(--card)}}
@media (prefers-reduced-motion:reduce){.slip.flash{animation:none}}
.slip .code{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;word-break:break-all}
.slip .full{grid-column:1/-1}
.slip .mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.slip .mini .sz{min-width:44px;padding:4px 8px;font-size:13px;border-width:1.5px}
.slip .note{display:flex;gap:6px;margin-top:6px}
.slip .note input{flex:1;min-width:0;padding:6px 8px;border:1px dashed var(--line);border-radius:6px;background:transparent;font-size:14px}
.slip .del{align-self:start;border:0;background:none;color:var(--ink2);font-size:13px;padding:4px}
.slip .jump{align-self:start;border:1px solid var(--line);background:none;border-radius:6px;font-size:13px;padding:3px 8px;color:var(--carbon)}
.slip .mv{font-size:13px;border:0;background:none;color:var(--carbon);padding:0}
.empty{padding:26px 10px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* month board */
.board{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.board table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.board th,.board td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.board th{font-size:13px;color:var(--ink2);font-weight:500;position:sticky;top:0;background:var(--card)}
.board th.szh{color:var(--c);font-weight:900}
.board td.d{text-align:left;padding-left:10px;font-weight:700}
.board td.d small{font-weight:400;color:var(--ink2);margin-left:4px}
.board tr.past td.d{color:var(--ink2)}
.board tr.today td.d{color:var(--stamp)}
.board td button{min-width:34px;border:0;border-radius:6px;padding:3px 6px;background:var(--c);color:var(--onc);font-weight:900}
.board td.z{color:var(--line)}
.board tfoot td{font-weight:900;border-bottom:0}
.board tr.sel td{background:var(--carbon-soft)}

.search input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.grp{margin:14px 0 6px;font-weight:700;font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* sheet */
.sheet{position:fixed;max-height:75vh;overflow-y:auto;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(20,30,50,.18);
  transform:translateY(105%);transition:transform .2s ease;z-index:20;max-width:600px;margin:0 auto}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .code{font-size:30px;line-height:1.2;font-weight:900;word-break:break-all;font-variant-numeric:tabular-nums}
.sheet .sizes{gap:10px}
.sheet .sizes .sz{flex:1 0 calc(33% - 10px);padding:22px 6px;font-size:28px;border-width:3px;border-radius:14px}
.sheet .meta{font-size:16px}
.sheet input[type=date]{font-size:18px;padding:10px 12px}
.sheet .qd{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.sheet .qd button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:18px;font-variant-numeric:tabular-nums}
.sheet .qd button[aria-pressed=true]{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.sheet .cancel{width:100%;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink2);font-size:17px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:13px;color:var(--ink2);gap:8px}
.foot button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
</style>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const WD = ['日','一','二','三','四','五','六'];
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const md = s => { const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; };
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const TODAY = ymd(new Date());

  let current = TODAY, month = TODAY.slice(0,7);
  let days = {};
  let sizes = ['60','80','100','120','140'];
  let curSize = '60';
  let db = null, mode = 'local', appMode = 'add';
  let freshId = null, cellSel = null;

  const sizeColor = s => { const i = sizes.indexOf(s); return i<0 ? 'var(--sx)' : 'var(--s'+(i%7)+')'; };
  const sizeLbl = s => s ? s : '未分';

  /* ---------- storage ---------- */
  function loadLocal(){
    try{ days = JSON.parse(localStorage.getItem('slipDays')||'{}'); }catch(e){ days = {}; }
    try{ const s = JSON.parse(localStorage.getItem('slipSizes')||'null'); if(Array.isArray(s)&&s.length) sizes = s; }catch(e){}
    try{ const c = localStorage.getItem('slipCurSize'); if(c) curSize = c; }catch(e){}
  }
  function saveLocal(){ try{ localStorage.setItem('slipDays', JSON.stringify(days)); localStorage.setItem('slipSizes', JSON.stringify(sizes)); }catch(e){} }

  const ROOT='slipScan';
  // 每張傳票各自一筆（days/日期/items/id）→ 多人同時登記不會互相覆蓋
  const itemPath=(date,id)=>'days/'+date+'/items/'+id;
  const cleanOne=i=>({id:i.id, code:i.code, size:i.size||'', order:i.order||'', note:i.note||'', t:i.t||'', ts:i.ts||0});
  const tsOf=i=>i.ts || parseInt(String(i.id).slice(0,8),36) || 0;
  const keyOf=code=>'c_'+String(code).replace(/[.#$\[\]\/\s]/g,'_');   // 用追蹤號碼當 key：兩台同時掃同一張只會有一筆
  let Q=[]; try{ Q=JSON.parse(localStorage.getItem('slipQ')||'[]'); }catch(_){ Q=[]; }
  const saveQ=()=>{ try{ localStorage.setItem('slipQ', JSON.stringify(Q)); }catch(_){} };
  let cloudCfg=false, flushing=false;
  function dbOp(path,val){
    saveLocal();
    if(!cloudCfg) return;
    Q.push({p:path, v:val==null?null:val}); saveQ(); setSync(); flush();
  }
  async function flush(){
    if(mode!=='db' || !rtdb || flushing) return; flushing=true;
    while(Q.length){
      const op=Q[0];
      try{ await rtdb.ref(ROOT+'/'+op.p).set(op.v); Q.shift(); saveQ(); }
      catch(e){ say('儲存失敗：'+(e.code||e.message)+'（請檢查資料庫規則）','warn'); break; }
      setSync();
    }
    flushing=false; setSync();
  }
  const putItem=(date,it)=>dbOp(itemPath(date,it.id), cleanOne(it));
  const delItem=(date,id)=>dbOp(itemPath(date,id), null);
  function applyQ(next){
    Q.forEach(op=>{ const m=op.p.match(/^days\/([^/]+)\/items\/(.+)$/); if(!m) return;
      const d=m[1], id=m[2], day=next[d]||(next[d]={date:d,items:[]});
      day.items=day.items.filter(i=>i.id!==id); if(op.v) day.items.push(Object.assign({},op.v));
      if(!day.items.length) delete next[d]; });
    Object.values(next).forEach(day=>day.items.sort((a,b)=>tsOf(b)-tsOf(a)));
    return next;
  }
  async function persistSizes(){
    saveLocal();
    if(mode!=='db') return;
    try{ await rtdb.ref(ROOT+'/sizes').set(sizes); }catch(e){ say('尺寸設定儲存失敗','warn'); }
  }

  let rtdb=null, online=false;
  async function init(){
    loadLocal(); render();
    const cfg=window.FIREBASE_CONFIG||{};
    if(!window.firebase || !cfg.apiKey || !cfg.databaseURL){ setSync(); return; }
    cloudCfg=true;
    try{
      firebase.initializeApp(cfg);
      try{ await firebase.auth().signInAnonymously(); }catch(_){ /* 規則不需登入時可略過 */ }
      rtdb=firebase.database(); mode='db';
    }catch(e){ say('雲端連線失敗，先存在本機：'+(e.code||e.message),'warn'); setSync(); return; }
    rtdb.ref('.info/connected').on('value',s=>{ online=!!s.val(); setSync(); if(online) flush(); });
    const localDays=Object.keys(days); let first=true;
    rtdb.ref(ROOT+'/days').on('value',snap=>{
      const v=snap.val()||{}, next={};
      Object.keys(v).forEach(d=>{
        const it=v[d]&&v[d].items; const arr=(Array.isArray(it)?it:(it?Object.values(it):[])).filter(Boolean);
        if(Array.isArray(it) && arr.length){ const obj={}; arr.forEach(i=>{ obj[i.id]=cleanOne(i); }); rtdb.ref(ROOT+'/days/'+d+'/items').set(obj).catch(()=>{}); }   // 舊格式轉換
        if(arr.length) next[d]={date:d, items:arr.map(i=>Object.assign({},i))};
      });
      if(first){
        first=false;
        const toPush=localDays.filter(d=>!next[d] && !Q.some(op=>op.p.startsWith('days/'+d+'/')));
        if(toPush.length){ toPush.forEach(d=>(days[d]?days[d].items:[]).forEach(i=>putItem(d,i))); say('已把本機的 '+toPush.length+' 天資料上傳雲端','ok'); }
      }
      days=applyQ(next); saveLocal(); render();
    }, e=>{ say('雲端讀取失敗：'+(e.code||e.message)+'（請檢查資料庫規則）','warn'); mode='local'; setSync(); });
    rtdb.ref(ROOT+'/colors').on('value',s=>{
      const v=s.val(); if(v && typeof v==='object'){ let changed=false;
        Object.keys(v).forEach(k=>{ if(v[k] && (!colors[k] || (v[k].ts||0)>(colors[k].ts||0))){ colors[k]=v[k]; changed=true; } });
        if(changed){ try{ localStorage.setItem('slipColors', JSON.stringify(colors)); }catch(_){} renderColors(); } }
    }, ()=>{});
    rtdb.ref(ROOT+'/shipOffset').on('value',s=>{ const v=s.val(); if(v!==null && v!==undefined && document.activeElement!==$('cOff')){ $('cOff').value=v; try{localStorage.setItem('slipOff',v);}catch(_){} } }, ()=>{});
    rtdb.ref(ROOT+'/sizes').on('value',s=>{
      const v=s.val(); const list=Array.isArray(v)?v:(v?Object.values(v):null);
      if(list&&list.length){ sizes=list.map(String); if(!sizes.includes(curSize)) curSize=sizes[0]; saveLocal(); render(); }
    }, ()=>{});
  }
  function setSync(cached){ $('syncState').textContent = mode==='db' ? (Q.length ? '⏳ '+Q.length+' 筆等待上傳'+(online?'…':'（離線中）') : online?'✓ 已同步雲端':'離線中，連線後自動同步') : '儲存在這台裝置'; }

  /* ---------- data ops ---------- */
  function findCode(code){
    const hits=[];
    for(const d in days) for(const it of days[d].items) if(it.code===code) hits.push({date:d, item:it});
    return hits.sort((a,b)=>a.date<b.date?-1:1);
  }
  let sessionN=0, toastT=null;
  const camOn=()=>$('cam').classList.contains('on');
  function camToast(t1,t2,bad){
    if(!camOn()) return;
    const t=$('toast'); t.innerHTML='<div class="t1">'+t1+'</div>'+(t2?'<div class="t2">'+t2+'</div>':'');
    $('toastBox').classList.add('on'); const c=$('cam'); c.classList.remove('hit','bad'); void c.offsetWidth; c.classList.add(bad?'bad':'hit');
    clearTimeout(toastT); toastT=setTimeout(()=>{ $('toastBox').classList.remove('on'); c.classList.remove('hit','bad'); }, 1600);
  }
  /* ---------- 傳票発送日 OCR ---------- */
  const ocrJobs={}, savedSrc={}; let ocrWorker=null, ocrLoading=null, ocrSource=null;
  const ocrOn=()=>$('ocrDate').checked && !!window.Tesseract;
  function ocrWarm(){
    if(!ocrOn() || ocrLoading) return ocrLoading;
    ocrLoading = Tesseract.createWorker('jpn', 1, {logger:()=>{}}).then(async w=>{
      await w.setParameters({tessedit_pageseg_mode:'3'}); ocrWorker=w; return w;
    }).catch(e=>{ ocrLoading=null; throw e; });
    return ocrLoading;
  }
  function grabFrame(){
    const v=$('reader').querySelector('video'); if(!v||!v.videoWidth) return null;
    const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0); return c;
  }
  // pure functions shared with app
  function maskBarcodes(g,w,h){
    // g: Uint8ClampedArray gray. returns {g2, vert} vert=true if bars run horizontally (image rotated)
    const hist=new Uint32Array(256); for(let i=0;i<g.length;i++) hist[g[i]]++;
    const pct=p=>{ let c=0,t=g.length*p; for(let v=0;v<256;v++){ c+=hist[v]; if(c>=t) return v; } return 255; };
    const th=(pct(0.05)+pct(0.95))/2;
    const th_=new Float32Array(w*h), tv_=new Float32Array(w*h);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x, b=g[i]<th;
      if(x+1<w && (g[i+1]<th)!==b) th_[i]=1; if(y+1<h && (g[i+w]<th)!==b) tv_[i]=1; }
    const blur=(a,R)=>{ const W=w+1, I=new Float64Array(W*(h+1));
      for(let y=0;y<h;y++){ let s=0; for(let x=0;x<w;x++){ s+=a[y*w+x]; I[(y+1)*W+x+1]=I[y*W+x+1]+s; } }
      const o=new Float32Array(w*h);
      for(let y=0;y<h;y++){ const y0=Math.max(0,y-R), y1=Math.min(h,y+R+1);
        for(let x=0;x<w;x++){ const x0=Math.max(0,x-R), x1=Math.min(w,x+R+1);
          o[y*w+x]=(I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0])/((y1-y0)*(x1-x0)); } }
      return o; };
    const R=Math.max(10,Math.round(Math.max(w,h)/68));   // ~20px window at 1366
    const dh=blur(th_,R), dv=blur(tv_,R);
    const hi=new Float32Array(w*h); let sh=0, sv=0;
    for(let i=0;i<w*h;i++){ const m=Math.max(dh[i],dv[i]); if(m>0.12){ hi[i]=1; sh+=dh[i]; sv+=dv[i]; } }
    const hm=blur(hi,Math.round(R*0.4));
    const g2=new Uint8ClampedArray(g); for(let i=0;i<w*h;i++) if(hm[i]>0.3) g2[i]=255;
    return {g2, vert: sv>sh*1.3};
  }
  // 縮到長邊 2000 → 灰階 → 把條碼塗白（條碼會干擾文字辨識）→ 判斷是否轉了 90 度
  function prepOCR(src){
    const sw=src.width, sh=src.height, k=Math.min(1, 2000/Math.max(sw,sh));
    const w=Math.round(sw*k), h=Math.round(sh*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
    x.drawImage(src,0,0,w,h);
    const im=x.getImageData(0,0,w,h), d=im.data, g=new Uint8ClampedArray(w*h);
    for(let i=0;i<w*h;i++) g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
    const r=maskBarcodes(g,w,h);
    for(let i=0;i<w*h;i++){ d[i*4]=d[i*4+1]=d[i*4+2]=r.g2[i]; }

    return keys.map(k=>'<span><span class="badge" style="--c:'+sizeColor(k)+'">'+esc(sizeLbl(k))+'</span> ×'+counts[k]+'</span>').join('');
  }

  let dupIdx={};
  function buildDup(){ dupIdx={}; for(const d in days) for(const i of days[d].items) (dupIdx[i.code]=dupIdx[i.code]||[]).push(d); }
  function slipHTML(it,date,search){
    const c=sizeColor(it.size);
    const others=(dupIdx[it.code]||[]).filter(d=>d!==date);
    let h='<li class="slip'+(it.id===freshId?' flash':'')+'" style="--c:'+c+'" data-date="'+date+'" data-id="'+it.id+'">'+
      '<div><div class="code">'+esc(fmtCode(it.code))+'</div><div class="meta">'+(search?md(date)+'　':'')+'<span class="badge" style="--c:'+c+'">'+esc(sizeLbl(it.size))+'</span>'+(it.order?'　訂 '+md(it.order):'')+'　'+esc(it.t||'')+(others.length?'<br><b style="color:var(--stamp)">⚠ 重複：也在 '+others.map(md).join('、')+'</b>':'')+'</div></div>';
    if(search){
      h+='<button class="jump" data-act="jump">看當天</button>'+(it.note?'<div class="full meta">'+esc(it.note)+'</div>':'');
    } else {
      h+='<button class="del" data-act="del" aria-label="刪除 '+esc(it.code)+'">刪除</button>'+
        '<div class="full mini">'+sizes.map(s=>'<button class="sz" data-act="size" data-s="'+esc(s)+'" style="--c:'+sizeColor(s)+'" aria-pressed="'+(s===it.size)+'">'+esc(s)+'</button>').join('')+'</div>'+
        '<div class="full note"><input data-act="note" value="'+esc(it.note||'')+'" placeholder="備註（廠商、品項…）"></div>'+
        '<div class="full" style="display:flex;flex-wrap:wrap;gap:4px 14px"><label class="mv">改出貨日 <input type="date" data-act="move" value="'+date+'" style="flex:none;padding:3px 6px;font-size:13px"></label>'+
        '<label class="mv">訂貨日 <input type="date" data-act="order" value="'+(it.order||'')+'" style="flex:none;padding:3px 6px;font-size:13px"></label></div>';
    }
    return h+'</li>';
  }

  function render(){
    buildDup();
    // stamp + date
    const dt=parse(current), s=$('stamp');
    s.querySelector('.m').textContent=(dt.getMonth()+1)+'月';

    $('sizeBar').innerHTML=sizes.map(x=>'<button class="sz" data-bar="'+esc(x)+'" style="--c:'+sizeColor(x)+'" aria-pressed="'+(x===curSize)+'">'+esc(x)+'</button>').join('')+
      '<button class="sz edit" id="editSizes">編輯尺寸</button>';

    // day

    if(!typing) $('dayList').innerHTML = items.length ? items.map(it=>slipHTML(it,current,false)).join('')
      : '<li class="empty"><b>'+md(current)+' 還沒有傳票</b>按「用相機掃描」開始登記</li>';

    renderMonth(); renderFind();
  }

  function renderMonth(){
    $('month').value=month;
    const [y,m]=month.split('-').map(Number);
    const dates=Object.keys(days).filter(d=>d.startsWith(month)).sort();
    const used=new Set(); dates.forEach(d=>days[d].items.forEach(i=>used.add(i.size||'')));
    const cols=[...sizes.filter(s=>used.has(s)), ...[...used].filter(k=>!sizes.includes(k))];
    if(!dates.length){ $('board').innerHTML='<div class="empty"><b>'+y+'年'+m+'月 沒有紀錄</b></div>'; $('cell').innerHTML=''; return; }
    const tot={}; let all=0;
    let h='<table><thead><tr><th style="text-align:left;padding-left:10px">出貨日</th>'+cols.map(c=>'<th class="szh" style="--c:'+sizeColor(c)+'">'+esc(sizeLbl(c))+'</th>').join('')+'<th>合計</th></tr></thead><tbody>';
    dates.forEach(d=>{
      const cnt=sizeCounts(days[d].items); const n=days[d].items.length; all+=n;
      const cls=[d<TODAY?'past':'', d===TODAY?'today':'', cellSel&&cellSel.date===d?'sel':''].join(' ');
      h+='<tr class="'+cls+'"><td class="d">'+md(d)+(d===TODAY?'<small>今天</small>':'')+'</td>'+cols.map(c=>{
        tot[c]=(tot[c]||0)+(cnt[c]||0);
        return cnt[c] ? '<td><button data-cell="'+d+'|'+esc(c)+'" style="--c:'+sizeColor(c)+'">'+cnt[c]+'</button></td>' : '<td class="z">·</td>';
      }).join('')+'<td><button data-cell="'+d+'|*" style="--c:var(--ink)">'+n+'</button></td></tr>';
    });
    h+='</tbody><tfoot><tr><td class="d">合計</td>'+cols.map(c=>'<td style="color:'+sizeColor(c)+'">'+tot[c]+'</td>').join('')+'<td>'+all+'</td></tr></tfoot></table>';
    $('board').innerHTML=h;
    // cell list
    if(cellSel && days[cellSel.date]){
      const its=days[cellSel.date].items.filter(i=>cellSel.size==='*'||(i.size||'')===cellSel.size);
      $('cell').innerHTML='<div class="grp">'+md(cellSel.date)+(cellSel.size==='*'?' 全部':' <span class="badge" style="--c:'+sizeColor(cellSel.size)+'">'+esc(sizeLbl(cellSel.size))+'</span>')+' '+its.length+' 張</div><ul class="list">'+its.map(it=>slipHTML(it,cellSel.date,true)).join('')+'</ul>';
    } else $('cell').innerHTML='<p class="meta">點數字可以看是哪幾張</p>';
  }

  function renderFind(){
    const q=$('q').value.trim().toLowerCase().replace(/[\s\-]/g,'');
    if(!q){ $('results').innerHTML='<p class="meta">也可以切到上方「包貨查詢」直接掃條碼查</p>'; return; }
    let h='',n=0;
    Object.keys(days).sort().reverse().forEach(d=>{
      const hits=days[d].items.filter(i=>i.code.toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q));
      if(!hits.length) return; n+=hits.length;
      h+='<div class="grp">'+md(d)+' '+d.slice(0,4)+'</div><ul class="list">'+hits.map(it=>slipHTML(it,d,true)).join('')+'</ul>';
    });
    $('results').innerHTML=n?h:'<div class="empty"><b>找不到「'+esc(q)+'」</b>試試輸入條碼的後幾碼</div>';
  }

  function go(d){ current=d; month=d.slice(0,7); freshId=null; render(); }
  function shift(n){ const d=parse(current); d.setDate(d.getDate()+n); go(ymd(d)); }
  function shiftMonth(n){ const [y,m]=month.split('-').map(Number); const d=new Date(y,m-1+n,1); month=d.getFullYear()+'-'+pad(d.getMonth()+1); cellSel=null; renderMonth(); }

  document.addEventListener('click',e=>{

    const qd=t.closest('[data-qd]'); if(qd){ pending.date=qd.dataset.qd; pending.src='manual'; $('shDate').value=pending.date; renderSheet(); renderSum(); return; }
    const shs=t.closest('[data-shs]'); if(shs && pending){

    const cell=t.closest('[data-cell]'); if(cell){ const [d,s]=cell.dataset.cell.split('|'); cellSel={date:d,size:s}; renderMonth(); $('cell').scrollIntoView({block:'nearest'}); return; }
    const b=t.closest('[data-act]'); if(!b) return;
    const li=b.closest('.slip'); if(!li) return;
    const a=b.dataset.act;
    if(a==='del'){ if(confirm('刪除這張傳票？')) removeItem(li.dataset.date,li.dataset.id); }
    else if(a==='jump'){ go(li.dataset.date); showTab('day'); setMode('add'); window.scrollTo({top:0}); }
    else if(a==='size'){ patchItem(li.dataset.date,li.dataset.id,{size:b.dataset.s}); }
  });
  document.addEventListener('input',e=>{
    const d=e.target.dataset||{};
    if(d.act==='note'){ const li=e.target.closest('.slip'); setNote(li.dataset.date,li.dataset.id,e.target.value); }
  });
  document.addEventListener('change',e=>{
    const d=e.target.dataset||{};
    if(d.act==='order'){ const li=e.target.closest('.slip'); patchItem(li.dataset.date, li.dataset.id, {order:e.target.value||''}); say(e.target.value?'訂貨日改為 '+md(e.target.value):'已清除訂貨日','ok'); return; }
    if(d.act==='move'){ const li=e.target.closest('.slip'); const to=e.target.value; moveItem(li.dataset.date,li.dataset.id,to); if(to) go(to); }
  });
  document.addEventListener('focusout',e=>{ if(e.target.dataset&&e.target.dataset.act==='note') setTimeout(render,0); });
  function setOrder(o){
    pending.order=o; $('shAuto').textContent='';
    if(o && shipOff()!==null && pending.src!=='ocr' && pending.src!=='manual' && pending.src!=='batch'){ pending.date=addDays(o,shipOff()); pending.src='color'; $('shDate').value=pending.date; }
    renderSheet(); renderSum();
  }
  $('shOrd').onchange=e=>{ if(pending) setOrder(e.target.value||''); };
  $('shOrdPrev').onclick=()=>{ if(pending && pending.order) setOrder(addDays(pending.order,-7)); };
  $('shOrdNext').onclick=()=>{ if(pending && pending.order) setOrder(addDays(pending.order,7)); };
  $('shDate').onchange=e=>{ if(e.target.value){ pending.date=e.target.value; pending.src='manual'; renderSheet(); renderSum(); } };
  $('shCancel').onclick=()=>{ closeSheet(); say('已略過'); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheetOpen){ closeSheet(); } });

  /* ---------- camera ---------- */
  let scanner=null, candCode='', candAt=0, camPurpose='scan';

  /* ---------- sticker colour ---------- */
  const WD_ORDER=[0,1,2,3,4,5,6];   // 跟倉庫的貼紙盒一樣：日→土
  const wdName=w=>'週'+WD[w];
  let colors={}, colorStep=null, calibWd=null, cTimer=null;
  try{ colors=JSON.parse(localStorage.getItem('slipColors')||'{}'); }catch(_){ colors={}; }
  // 預設 7 色（依倉庫的貼紙）：日白・月黃・火藍・水粉・木橘・金綠・土紫
  const DEF_COLORS={0:['#F2EFE6','白'],1:['#F1E36B','黃'],2:['#8EC5E8','藍'],3:['#F3A9C4','粉'],4:['#F7A33B','橘'],5:['#7FB246','綠'],6:['#A99BD8','紫']};
  Object.keys(DEF_COLORS).forEach(w=>{ if(!colors[w]){ const [h,n]=DEF_COLORS[w]; const rgb=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); colors[w]={rgb, lab:rgb2lab(...rgb), name:n, manual:true, ts:0}; } });
  try{ const o=localStorage.getItem('slipOff'); if(o!==null) $('cOff').value=o; const a=localStorage.getItem('slipCAuto'); if(a!==null) $('cAuto').checked=a==='1'; }catch(_){}
  const shipOff=()=>{ const v=$('cOff').value.trim(); return v===''||isNaN(+v) ? null : Math.max(0,Math.min(30,Math.round(+v))); };
  const addDays=(d,n)=>{ const x=parse(d); x.setDate(x.getDate()+n); return ymd(x); };
  const lastWeekday=w=>{ const x=new Date(); while(x.getDay()!==w) x.setDate(x.getDate()-1); return ymd(x); };
  const calibrated=()=>WD_ORDER.filter(w=>colors[w]).length;
  const colorReady=()=>$('cAuto').checked && WD_ORDER.filter(w=>colors[w]&&!colors[w].manual).length>=2;   // 只有用相機校正過的才自動辨識
  const swatch=w=>colors[w] ? '<i style="background:rgb('+colors[w].rgb.join(',')+')"></i>' : '<i class="none"></i>';

  function rgb2lab(r,g,b){
    [r,g,b]=[r,g,b].map(v=>{ v/=255; return v>0.04045?Math.pow((v+0.055)/1.055,2.4):v/12.92; });
    let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047, y=r*0.2126+g*0.7152+b*0.0722, z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
    [x,y,z]=[x,y,z].map(v=>v>0.008856?Math.cbrt(v):7.787*v+16/116);
    return [116*y-16, 500*(x-y), 200*(y-z)];
  }
  const cv=document.createElement('canvas'); cv.width=cv.height=24; const cx=cv.getContext('2d',{willReadFrequently:true});
  function sample(){
    const v=$('reader').querySelector('video'); if(!v||!v.videoWidth) return null;
    const disp=v.getBoundingClientRect(); if(!disp.width) return null;
    const side=Math.max(8, 60*(v.videoWidth/disp.width));
    cx.drawImage(v, v.videoWidth/2-side/2, v.videoHeight/2-side/2, side, side, 0,0,24,24);
    const px=cx.getImageData(0,0,24,24).data; const rs=[],gs=[],bs=[];
    for(let i=0;i<px.length;i+=4){ rs.push(px[i]); gs.push(px[i+1]); bs.push(px[i+2]); }
    const med=a=>{ a.sort((x,y)=>x-y); return a[a.length>>1]; };
    const rgb=[med(rs),med(gs),med(bs)];
    return {rgb, lab:rgb2lab(...rgb)};
  }
  function classify(lab){
    const ds=WD_ORDER.filter(w=>colors[w]).map(w=>{ const c=colors[w].lab; return {w, d:Math.hypot((lab[0]-c[0])*0.5, lab[1]-c[1], lab[2]-c[2])}; }).sort((a,b)=>a.d-b.d);
    if(!ds.length) return null;
    const best=ds[0], second=ds[1]||{d:999};
    return {w:best.w, ok: best.d<32 && second.d-best.d>6};
  }
  function showColorUI(label, btn){
    $('cTarget').hidden=false; $('cBar').hidden=false; $('cLb').textContent=label;
    $('cGo').hidden=!btn; $('cGo').textContent=btn||'';
  }
  function endColorUI(){ clearInterval(cTimer); cTimer=null; $('cTarget').hidden=true; $('cBar').hidden=true; if(camPurpose==='scan') setStage('scan'); }

  function startColorStep(code){
    colorStep={code, last:-1, n:0, t0:Date.now()};
    setStage('color');
    showColorUI('找貼紙中…', '');
    $('cSk').textContent='跳過';
    cTimer=setInterval(()=>{
      const sm=sample(); if(!sm||!colorStep) return;
      $('cSw').style.background='rgb('+sm.rgb.join(',')+')';
      const r=classify(sm.lab);
      if(r&&r.ok){
        $('cLb').textContent=(colors[r.w]&&colors[r.w].name?colors[r.w].name+' ':'')+wdName(r.w)+'？';
        if(r.w===colorStep.last) colorStep.n++; else { colorStep.last=r.w; colorStep.n=1; }
        if(colorStep.n>=4){
          const c=colorStep.code, o=lastWeekday(r.w); colorStep=null; endColorUI(); buzz(80);
          camToast('🎨 '+(colors[r.w]&&colors[r.w].name?colors[r.w].name+'＝':'')+wdName(r.w)+' 訂貨', md(o)); afterColor(c, o, true);
        }
      } else { $('cLb').textContent='認不出顏色'; colorStep.n=0; colorStep.last=-1; }
    }, 140);
  }
  $('cSk').onclick=()=>{
    if(colorStep){ const c=colorStep.code; colorStep=null; endColorUI(); afterColor(c,''); }
    else if(calibWd!==null){ nextCalib(); }
  };

  /* calibration */
  function beginCalib(){
    if(calibWd===null) calibWd=0;
    setStage('calib');
    showColorUI('校正 '+wdName(calibWd), '取色'); $('cSk').textContent='下一個';
    clearInterval(cTimer);
    cTimer=setInterval(()=>{ const sm=sample(); if(sm) $('cSw').style.background='rgb('+sm.rgb.join(',')+')'; }, 150);
  }
  function nextCalib(){
    const i=WD_ORDER.indexOf(calibWd);
    if(i===WD_ORDER.length-1 || calibAll===false){ calibWd=null; endColorUI(); stopScan(); renderColors(); return; }
    calibWd=WD_ORDER[i+1]; beginCalib();
  }
  let calibAll=false;
  $('cGo').onclick=async()=>{
    if(calibWd===null) return;
    const acc=[];
    for(let k=0;k<6;k++){ const sm=sample(); if(sm) acc.push(sm.rgb); await new Promise(r=>setTimeout(r,80)); }
    if(!acc.length){ camToast('取色失敗','請再試一次',true); return; }
    const rgb=[0,1,2].map(j=>Math.round(acc.reduce((a,c)=>a+c[j],0)/acc.length));
    colors[calibWd]={rgb, lab:rgb2lab(...rgb), name:(colors[calibWd]&&colors[calibWd].name)||'', ts:Date.now()};
    saveColors(); camToast('✓ '+wdName(calibWd)+' 已記住','<span style="display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;background:rgb('+rgb.join(',')+')"></span>'); buzz(60);
    nextCalib();
  };
  function saveColors(){
    try{ localStorage.setItem('slipColors', JSON.stringify(colors)); }catch(_){}
    if(mode==='db' && rtdb) rtdb.ref(ROOT+'/colors').set(colors).catch(()=>{});
    renderColors();
  }
  function renderColors(){
    const hex=w=>colors[w]?'#'+colors[w].rgb.map(x=>x.toString(16).padStart(2,'0')).join(''):'#cccccc';
    $('cRows').innerHTML=WD_ORDER.map(w=>'<div class="crow"><input type="color" class="cpick" data-pick="'+w+'" value="'+hex(w)+'" aria-label="'+wdName(w)+'的顏色">'+
      '<b>'+wdName(w)+'</b><input class="cname" data-cname="'+w+'" value="'+esc((colors[w]&&colors[w].name)||'')+'" placeholder="顏色名" maxlength="4">'+
      '<button data-cal="'+w+'">'+(colors[w]&&!colors[w].manual?'重新校正':'相機校正')+'</button></div>').join('');
    $('cOpen').textContent='🎨 貼紙 7 色設定（已設定 '+calibrated()+'/7）';
  }
  $('cOpen').onclick=()=>{ $('cPanel').hidden=!$('cPanel').hidden; renderColors(); };
  $('cAll').onclick=()=>{ calibAll=true; calibWd=0; startCamera('calib'); };
  $('cRows').addEventListener('input',e=>{
    const pk=e.target.dataset.pick, nm=e.target.dataset.cname;
    if(pk!==undefined){ const h=e.target.value; const rgb=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
      colors[pk]=Object.assign({}, colors[pk]||{}, {rgb, lab:rgb2lab(...rgb), manual:true, ts:Date.now()}); clearTimeout(colorSaveT); colorSaveT=setTimeout(saveColorsQuiet,400); }
    if(nm!==undefined){ colors[nm]=Object.assign({rgb:[204,204,204], lab:rgb2lab(204,204,204), manual:true}, colors[nm]||{}, {name:e.target.value.trim(), ts:Date.now()}); clearTimeout(colorSaveT); colorSaveT=setTimeout(saveColorsQuiet,600); }
  });
  let colorSaveT=null;
  function saveColorsQuiet(){
    try{ localStorage.setItem('slipColors', JSON.stringify(colors)); }catch(_){}
    if(mode==='db' && rtdb) rtdb.ref(ROOT+'/colors').set(colors).catch(()=>{});

  $('cRows').onclick=e=>{ const b=e.target.closest('[data-cal]'); if(!b) return; calibAll=false; calibWd=+b.dataset.cal; startCamera('calib'); };
  try{ const v=localStorage.getItem('slipOnlyTrack'); if(v!==null) $('onlyTrack').checked=v==='1'; }catch(_){}
  $('onlyTrack').onchange=()=>{ try{ localStorage.setItem('slipOnlyTrack',$('onlyTrack').checked?'1':'0'); }catch(_){} };
  $('cAuto').onchange=()=>{ try{ localStorage.setItem('slipCAuto', $('cAuto').checked?'1':'0'); }catch(_){} };
  $('cOff').onchange=()=>{ try{ localStorage.setItem('slipOff', $('cOff').value.trim()); }catch(_){}
    if(mode==='db' && rtdb) rtdb.ref(ROOT+'/shipOffset').set($('cOff').value.trim()).catch(()=>{}); };
  renderColors();
  function confirmRead(text){
    const now=Date.now();
    if($('onlyTrack').checked && !isTrack(normCode(text))){ onCode(text); return; } // 其他條碼：只提示，不影響確認
    if(text===candCode && now-candAt<2500){ candCode=''; vfGot(); onCode(text); }
    else { candCode=text; candAt=now; }
  }
  $('scan').onclick=()=>startCamera('scan');

  /* 條碼引擎：Android Chrome 用內建 BarcodeDetector（最快），其他（iPhone 等）用 ZXing WebAssembly */
  let detector=null, detKind='';
  const FMTS=['codabar','code_128','code_39','itf','ean_13','ean_8','qr_code'];
  async function getDetector(){
    if(detector) return detector;
    if('BarcodeDetector' in window){
      try{ const sup=await window.BarcodeDetector.getSupportedFormats(); const f=FMTS.filter(x=>sup.includes(x));
        if(f.includes('codabar')||f.includes('code_128')){ detector=new window.BarcodeDetector({formats:f}); detKind='native'; return detector; } }catch(_){}
    }
    if(window.BarcodeDetectionAPI){ detector=new BarcodeDetectionAPI.BarcodeDetector({formats:FMTS}); detKind='wasm'; return detector; }
    throw new Error('no barcode engine');
  }
  getDetector().then(d=>{ if(detKind==='wasm'){ const c=document.createElement('canvas'); c.width=c.height=8; d.detect(c).catch(()=>{}); } }).catch(()=>{});   // 先載入，第一次掃描就快

  const scv=document.createElement('canvas'), sctx=scv.getContext('2d',{willReadFrequently:true});
  function cropFor(v, full){
    const vw=v.videoWidth, vh=v.videoHeight; if(!vw) return null;
    let sx=0, sy=0, sw=vw, sh=vh;
    if(!full){
      const vr=v.getBoundingClientRect(), fr=$('vf').getBoundingClientRect();
      if(!vr.width || !fr.width || $('vf').hidden) return null;
      const k=vw/vr.width;
      sx=(fr.left-vr.left-fr.width*0.07)*k; sw=fr.width*1.14*k;
      sy=(fr.top-vr.top-fr.height*0.25)*k; sh=fr.height*1.5*k;
      sx=Math.max(0,sx); sy=Math.max(0,sy); sw=Math.min(vw-sx,sw); sh=Math.min(vh-sy,sh);
    }
    const sc=Math.min(1, (full?1280:1100)/Math.max(sw,sh));
    scv.width=Math.round(sw*sc); scv.height=Math.round(sh*sc);
    sctx.drawImage(v,sx,sy,sw,sh,0,0,scv.width,scv.height); return scv;
  }
  function handleResults(res){
    const vals=(res||[]).map(r=>r.rawValue).filter(Boolean); if(!vals.length) return;
    if($('onlyTrack').checked){
      const t=vals.find(v=>isTrack(normCode(v)));
      if(t){ candCode=''; vfGot(); onCode(t); }            // 有檢查碼保護，讀到一次就算
      else onCode(vals[0]);                                 // 只會顯示「請對準お問合せNo」提示
    } else confirmRead(vals[0]);
  }
  async function loop(){
    const S=scanner; if(!S || !S.running) return;
    const v=S.video;
    if(camPurpose==='scan' && !colorStep && !sheetOpen && v.readyState>=2 && !S.busy){
      S.n=(S.n+1)%3; const src=cropFor(v, S.n===2) || cropFor(v,true);   // 2/3 掃框內、1/3 掃整個畫面（傳票轉向時也讀得到）
      if(src){ S.busy=true; try{ handleResults(await detector.detect(src)); }catch(_){} S.busy=false; }
    }
    if(S.running) S.raf=requestAnimationFrame(loop);
  }
  async function startCamera(purpose){
    camPurpose=purpose;
    if(scanner){ if(purpose==='calib') beginCalib(); else { endColorUI(); setStage('scan'); } return; }
    try{ await getDetector(); }catch(_){ say('掃描元件載入失敗，請確認網路後重開，或改用手動輸入','warn'); return; }
    sessionN=0; sessionList=[]; renderRecent(); $('cam').classList.add('on'); document.body.classList.add('camOn'); $('lookup').classList.remove('on'); $('camLook').appendChild($('lookup')); camInfo();
    const hi = purpose==='scan' && !isBatch() && $('ocrDate').checked;   // 要讀字才用高解析度，批次模式用 720p 比較快
    try{
      if(hi) try{ ocrWarm(); }catch(_){}
      const stream=await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:hi?1920:1280}, height:{ideal:hi?1080:720}}});
      const v=document.createElement('video'); v.setAttribute('playsinline',''); v.muted=true; v.autoplay=true; v.srcObject=stream;
      $('reader').innerHTML=''; $('reader').appendChild(v); await v.play();
      const track=stream.getVideoTracks()[0];
      scanner={stream, video:v, track, running:true, busy:false, n:0, torch:false};
      try{ const c=track.getCapabilities?track.getCapabilities():{};
        if(c.focusMode && c.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
        $('torch').hidden=!c.torch; $('torch').setAttribute('aria-pressed','false'); }catch(_){ $('torch').hidden=true; }
      setTimeout(placeVF,50); setStage('scan'); renderBatchDates();
      loop();
      if(purpose==='calib') beginCalib();
    }catch(err){ await stopScan(); say('無法開啟相機（可能沒有授權）。請改用「拍照辨識」或手動輸入。','warn'); }
  }
  $('torch').onclick=async()=>{ if(!scanner) return; scanner.torch=!scanner.torch;
    try{ await scanner.track.applyConstraints({advanced:[{torch:scanner.torch}]}); }catch(_){}
    $('torch').setAttribute('aria-pressed', scanner.torch); };
  async function stopScan(){
    if(scanner){ scanner.running=false; cancelAnimationFrame(scanner.raf); try{ scanner.stream.getTracks().forEach(t=>t.stop()); }catch(_){} }
    $('reader').innerHTML='';
    endColorUI(); colorStep=null; calibWd=null;
    scanner=null; $('cam').classList.remove('on'); document.body.classList.remove('camOn'); $('lookup').classList.remove('on'); $('lookHome').after($('lookup'));
    if(sessionN) say('這次掃了 '+sessionN+' 張','ok');
  }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && scanner) stopScan(); });   // 切到背景就關相機，省電
  $('stop').onclick=()=>{ if(sheetOpen) closeSheet(); calibAll=false; stopScan(); };
  $('photoBtn').onclick=()=>$('photo').click();
  $('photo').onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
    say('辨識中…');
    try{
      const d=await getDetector(); const bmp=await createImageBitmap(f);
      const vals=(await d.detect(bmp)).map(r=>r.rawValue).filter(Boolean);
      const text=vals.find(v=>isTrack(normCode(v))) || vals[0];
      if(!text) throw new Error('none');
      lastCode=''; say(''); ocrSource=bmp; onCode(text); ocrSource=null;
    }catch(err){ say('照片裡找不到條碼，請靠近一點、避免反光再拍一次','warn'); }
  };

  /* ---------- CSV ---------- */
  $('csv').onclick=async()=>{
    const rows=[['出貨日','箱子尺寸','訂貨日','條碼','備註','登記時間']];
    Object.keys(days).sort().forEach(d=>days[d].items.slice().reverse().forEach(i=>rows.push([d,sizeLbl(i.size),i.order||'',i.code,i.note||'',i.t||''])));
    if(rows.length===1){ say('還沒有資料可以匯出'); return; }
    const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a=document.createElement('a'); a.href=url; a.download='傳票_'+TODAY+'.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };

  document.body.appendChild($('cam'));
  applyMode();
  function setZoom(z){
    document.documentElement.style.setProperty('--z', z);
    document.querySelectorAll('#zoomctl button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.z===String(z)));
    try{ localStorage.setItem('slipZoom', z); }catch(_){}
  }
  let z0='1.3'; try{ z0=localStorage.getItem('slipZoom')||'1.3'; }catch(_){}
  setZoom(z0);
  $('zoomctl').onclick=e=>{ const b=e.target.closest('[data-z]'); if(b) setZoom(b.dataset.z); };
  init();
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('install').hidden=false; });
  $('install').onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('install').hidden=true; };
})();
</script>
</body>
